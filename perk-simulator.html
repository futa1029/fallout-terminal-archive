<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fallout 76 Perk Simulator | Overseer Mohi's Terminal</title>
    <link rel="canonical" href="https://www.fallout-jp.com/perk-simulator.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Overseer Mohi's Terminal">
    <meta property="og:title" content="Fallout 76 Perk Simulator">
    <meta property="og:description" content="Fallout 76のPerkビルドシミュレーター。SPECIAL配分、Perkカード選択、レジェンダリーPerk、変異を自由にカスタマイズ。">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-color: #00ff00;
            --accent-dim: #00aa00;
            --panel-bg: #151515;
            --panel-border: #333;
            --str-color: #ff6b6b;
            --per-color: #ffd93d;
            --end-color: #6bcb77;
            --chr-color: #ff8c42;
            --int-color: #4ecdc4;
            --agi-color: #9b59b6;
            --lck-color: #3498db;
            --legendary-color: #ffd700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Noto Sans JP', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
        }

        /* ヘッダー */
        .sim-header {
            background: linear-gradient(135deg, #111 0%, #1a1a1a 100%);
            border-bottom: 2px solid var(--accent-color);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .sim-header h1 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-color);
            font-size: 1.6em;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        .sim-header h1 span {
            font-size: 0.55em;
            color: #888;
            font-family: 'Noto Sans JP', sans-serif;
            font-weight: normal;
            display: block;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .header-btn {
            background: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85em;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .header-btn:hover {
            background: var(--accent-color);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }

        /* メインレイアウト */
        .sim-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        /* SPECIAL パネル */
        .special-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .special-panel h2 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-color);
            font-size: 1.2em;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 10px;
        }

        .points-remaining {
            text-align: center;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(0, 255, 0, 0.05);
            border-radius: 4px;
            border: 1px solid var(--panel-border);
        }

        .points-remaining .count {
            color: var(--accent-color);
            font-size: 1.8em;
            font-weight: bold;
        }

        .special-stat {
            display: grid;
            grid-template-columns: 30px 1fr 90px;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .special-stat:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .special-stat.active {
            background: rgba(0, 255, 0, 0.08);
            border: 1px solid var(--accent-dim);
        }

        .stat-letter {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.4em;
            font-weight: bold;
            text-align: center;
        }

        .stat-info {
            display: flex;
            flex-direction: column;
        }

        .stat-name {
            font-size: 0.85em;
            color: #aaa;
        }

        .stat-bar {
            height: 6px;
            background: #333;
            border-radius: 3px;
            margin-top: 3px;
            overflow: hidden;
        }

        .stat-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.3s;
        }

        .stat-controls {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .stat-btn {
            width: 28px;
            height: 28px;
            background: transparent;
            border: 1px solid #555;
            color: var(--text-color);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }

        .stat-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .stat-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .stat-value {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.3em;
            width: 30px;
            text-align: center;
            font-weight: bold;
        }

        /* 装備中パネル */
        .equipped-summary {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--panel-border);
        }

        .equipped-summary h3 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-color);
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .equipped-cost {
            font-size: 0.85em;
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }

        .equipped-cost .over {
            color: #ff6b6b;
            font-weight: bold;
        }

        /* Perk選択エリア */
        .perk-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* タブ */
        .perk-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .perk-tab {
            padding: 8px 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: #aaa;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85em;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .perk-tab:hover {
            border-color: #666;
            color: var(--text-color);
        }

        .perk-tab.active {
            border-color: var(--accent-color);
            color: var(--accent-color);
            background: rgba(0, 255, 0, 0.05);
        }

        .perk-tab[data-tab="Legendary"] {
            border-color: rgba(255, 215, 0, 0.3);
        }

        .perk-tab[data-tab="Legendary"].active {
            border-color: var(--legendary-color);
            color: var(--legendary-color);
            background: rgba(255, 215, 0, 0.05);
        }

        .perk-tab[data-tab="Mutations"] {
            border-color: rgba(155, 89, 182, 0.3);
        }

        .perk-tab[data-tab="Mutations"].active {
            border-color: #9b59b6;
            color: #9b59b6;
            background: rgba(155, 89, 182, 0.05);
        }

        /* Perkリスト */
        .perk-list-container {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 20px;
        }

        .perk-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .perk-list-header h2 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.1em;
        }

        .perk-search {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 4px;
            font-family: 'Noto Sans JP', sans-serif;
            font-size: 0.9em;
            width: 200px;
            outline: none;
            transition: border-color 0.2s;
        }

        .perk-search:focus {
            border-color: var(--accent-color);
        }

        .perk-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 10px;
        }

        /* Perkカード */
        .perk-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .perk-card:hover {
            border-color: #555;
            transform: translateY(-1px);
        }

        .perk-card.equipped {
            border-color: var(--accent-color);
            background: rgba(0, 255, 0, 0.04);
        }

        .perk-card-img {
            width: 52px;
            height: 52px;
            border-radius: 4px;
            object-fit: contain;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
        }

        .perk-card-img.error {
            display: none;
        }

        .perk-card-body {
            flex: 1;
            min-width: 0;
        }

        .perk-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 4px;
        }

        .perk-card-name {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.95em;
            color: var(--accent-color);
            font-weight: bold;
        }

        .perk-card.equipped .perk-card-name {
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
        }

        .perk-card-cost {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8em;
            color: #888;
            white-space: nowrap;
        }

        .perk-card-desc {
            font-size: 0.82em;
            color: #999;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .perk-card-ranks {
            display: flex;
            gap: 4px;
        }

        .rank-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            border: 1px solid #555;
            background: transparent;
            transition: all 0.2s;
            cursor: pointer;
        }

        .rank-dot.filled {
            background: var(--accent-color);
            border-color: var(--accent-color);
            box-shadow: 0 0 6px rgba(0, 255, 0, 0.3);
        }

        .rank-dot:hover {
            border-color: var(--accent-color);
        }

        .perk-card-level {
            font-size: 0.7em;
            color: #666;
            font-family: 'Share Tech Mono', monospace;
            white-space: nowrap;
            margin-left: 8px;
        }

        /* 変異カード */
        .mutation-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mutation-card:hover {
            border-color: #555;
        }

        .mutation-card.active {
            border-color: #9b59b6;
            background: rgba(155, 89, 182, 0.06);
        }

        .mutation-name {
            font-family: 'Share Tech Mono', monospace;
            color: #9b59b6;
            font-size: 0.95em;
            margin-bottom: 4px;
        }

        .mutation-effect {
            font-size: 0.82em;
            color: #999;
        }

        .mutation-effect .positive {
            color: #6bcb77;
        }

        .mutation-effect .negative {
            color: #ff6b6b;
        }

        /* レジェンダリーPerkカード */
        .legendary-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #2a2a2a;
            border-radius: 6px;
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .legendary-card:hover {
            border-color: rgba(255, 215, 0, 0.4);
        }

        .legendary-card.equipped {
            border-color: var(--legendary-color);
            background: rgba(255, 215, 0, 0.04);
        }

        .legendary-card .perk-card-name {
            color: var(--legendary-color);
        }

        .legendary-card .rank-dot.filled {
            background: var(--legendary-color);
            border-color: var(--legendary-color);
            box-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
        }

        /* ビルドサマリー - ゲーム内レイアウト */
        .build-summary {
            background: linear-gradient(180deg, #1a1a0f 0%, #12120a 100%);
            border: 2px solid #8b7d3c;
            border-radius: 4px;
            padding: 0;
            overflow: hidden;
        }

        .build-summary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 15px;
            background: linear-gradient(90deg, #2a2510, #3d3520, #2a2510);
            border-bottom: 2px solid #8b7d3c;
        }

        .build-summary-header h2 {
            font-family: 'Share Tech Mono', monospace;
            color: #d4c47a;
            font-size: 1.0em;
            margin: 0;
        }

        /* SPECIAL 7列ヘッダー */
        .build-special-row {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            border-bottom: 1px solid #4a4228;
            background: rgba(0, 0, 0, 0.3);
        }

        .build-special-col {
            text-align: center;
            padding: 8px 4px;
            border-right: 1px solid #3a3420;
            font-family: 'Share Tech Mono', monospace;
        }

        .build-special-col:last-child {
            border-right: none;
        }

        .build-special-name {
            font-size: 0.7em;
            color: #999;
            display: block;
        }

        .build-special-value {
            font-size: 1.3em;
            font-weight: bold;
            display: block;
            margin-top: 2px;
        }

        /* 装備Perkグリッド */
        .build-perks-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            min-height: 100px;
        }

        .build-perk-column {
            border-right: 1px solid #2a2418;
            padding: 4px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .build-perk-column:last-child {
            border-right: none;
        }

        /* 装備Perkカード（小） */
        .build-perk-item {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 3px 5px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #3a3420;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s;
            min-height: 30px;
        }

        .build-perk-item:hover {
            background: rgba(139, 125, 60, 0.15);
            border-color: #8b7d3c;
        }

        .build-perk-item.selected {
            background: rgba(139, 125, 60, 0.25);
            border-color: #d4c47a;
        }

        .build-perk-img {
            width: 26px;
            height: 26px;
            border-radius: 3px;
            object-fit: contain;
            flex-shrink: 0;
        }

        .build-perk-img.error {
            display: none;
        }

        .build-perk-cost {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85em;
            font-weight: bold;
            color: #d4c47a;
            min-width: 14px;
            text-align: center;
        }

        .build-perk-name {
            font-size: 0.7em;
            color: #c0b070;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }

        .build-perk-stars {
            font-size: 0.55em;
            color: #d4c47a;
            white-space: nowrap;
        }

        /* 選択Perk詳細（下部） */
        .build-perk-detail {
            display: flex;
            gap: 15px;
            padding: 12px 15px;
            border-top: 2px solid #4a4228;
            background: rgba(0, 0, 0, 0.4);
            min-height: 90px;
            align-items: center;
        }

        .build-detail-img {
            width: 70px;
            height: 70px;
            border-radius: 4px;
            object-fit: contain;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #8b7d3c;
            flex-shrink: 0;
        }

        .build-detail-info {
            flex: 1;
        }

        .build-detail-name {
            font-family: 'Share Tech Mono', monospace;
            color: #d4c47a;
            font-size: 1.0em;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .build-detail-desc {
            font-size: 0.82em;
            color: #b0a060;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .build-detail-stars {
            color: #d4c47a;
            font-size: 0.9em;
        }

        .build-detail-stars .star-filled {
            color: #d4c47a;
        }

        .build-detail-stars .star-empty {
            color: #4a4228;
        }

        /* レジェンダリーバナー */
        .build-legendary-section {
            padding: 8px 12px;
            border-top: 2px solid #8b7d3c;
            background: linear-gradient(90deg, rgba(40, 35, 15, 0.9), rgba(60, 50, 20, 0.6));
        }

        .build-legendary-title {
            font-family: 'Share Tech Mono', monospace;
            color: var(--legendary-color);
            font-size: 0.8em;
            margin-bottom: 6px;
        }

        .build-legendary-list {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .build-legendary-item {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 3px 8px;
            background: rgba(255, 215, 0, 0.06);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 3px;
            font-size: 0.75em;
        }

        .build-legendary-item img {
            width: 24px;
            height: 24px;
            border-radius: 2px;
        }

        .build-legendary-item .l-name {
            color: var(--legendary-color);
            font-family: 'Share Tech Mono', monospace;
        }

        .build-legendary-item .l-rank {
            color: #b0a060;
            font-size: 0.85em;
        }

        /* ミューテーションバナー */
        .build-mutation-section {
            padding: 8px 12px;
            border-top: 1px solid #4a4228;
            background: rgba(155, 89, 182, 0.04);
        }

        .build-mutation-title {
            font-family: 'Share Tech Mono', monospace;
            color: #9b59b6;
            font-size: 0.8em;
            margin-bottom: 6px;
        }

        .build-mutation-list {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .build-mutation-tag {
            padding: 2px 7px;
            background: rgba(155, 89, 182, 0.08);
            border: 1px solid rgba(155, 89, 182, 0.2);
            border-radius: 3px;
            font-size: 0.72em;
            color: #9b59b6;
            font-family: 'Share Tech Mono', monospace;
        }

        /* ビルド空状態 */
        .build-empty {
            text-align: center;
            padding: 30px;
            color: #5a5030;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9em;
        }

        /* レスポンシブ */
        @media (max-width: 900px) {
            .sim-container {
                grid-template-columns: 1fr;
            }

            .special-panel {
                position: static;
            }

            .perk-grid {
                grid-template-columns: 1fr;
            }
        }

        /* リセットボタン */
        .reset-btn {
            background: transparent;
            border: 1px solid #ff6b6b;
            color: #ff6b6b;
            padding: 6px 14px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8em;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .reset-btn:hover {
            background: #ff6b6b;
            color: var(--bg-color);
        }

        /* 共有URL */
        .share-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 9999;
            justify-content: center;
            align-items: center;
        }

        .share-modal.active {
            display: flex;
        }

        .share-modal-content {
            background: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 8px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
        }

        .share-modal-content h3 {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-color);
            margin-bottom: 15px;
        }

        .share-url-box {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.85em;
            border-radius: 4px;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .ghoul-tag {
            font-size: 0.65em;
            color: #9b59b6;
            border: 1px solid #9b59b6;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: 5px;
        }

        /* 人間/グール切替トグル */
        .race-toggle-container {
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--panel-border);
        }

        .race-toggle-label {
            font-family: 'Share Tech Mono', monospace;
            color: var(--accent-color);
            font-size: 0.85em;
            margin-bottom: 8px;
            display: block;
        }

        .race-toggle {
            display: flex;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            overflow: hidden;
        }

        .race-toggle-btn {
            flex: 1;
            padding: 8px 12px;
            background: transparent;
            border: none;
            color: #888;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .race-toggle-btn:first-child {
            border-right: 1px solid var(--panel-border);
        }

        .race-toggle-btn.active {
            background: var(--accent-color);
            color: var(--bg-color);
            font-weight: bold;
            text-shadow: none;
        }

        .race-toggle-btn:hover:not(.active) {
            background: rgba(0, 255, 0, 0.1);
            color: var(--accent-color);
        }

        .race-toggle-btn.ghoul-active {
            background: #8b4513;
            border-color: #cd853f;
            color: #ffd700;
        }

        .race-indicator {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75em;
            text-align: center;
            margin-top: 6px;
            padding: 3px 8px;
            border-radius: 3px;
            transition: all 0.3s;
        }

        .race-indicator.human {
            color: var(--accent-color);
            background: rgba(0, 255, 0, 0.08);
        }

        .race-indicator.ghoul {
            color: #ffd700;
            background: rgba(139, 69, 19, 0.2);
        }
    </style>
</head>

<body>
    <!-- ヘッダー -->
    <header class="sim-header">
        <h1>FALLOUT 76 PERK SIMULATOR<span>パークビルドシミュレーター</span></h1>
        <div class="header-actions">
            <button class="header-btn" onclick="resetBuild()">⟲ RESET</button>
            <button class="header-btn" onclick="shareBuild()">⤴ SHARE</button>
            <a href="lore.html" class="header-btn">◁ TERMINAL</a>
        </div>
    </header>

    <div class="sim-container">
        <!-- 左: SPECIAL配分 -->
        <aside class="special-panel">
            <h2>> S.P.E.C.I.A.L.</h2>
            <div class="race-toggle-container">
                <span class="race-toggle-label">> CHARACTER TYPE</span>
                <div class="race-toggle" id="race-toggle">
                    <button class="race-toggle-btn active" id="race-human-btn" onclick="setRace('human')">HUMAN</button>
                    <button class="race-toggle-btn" id="race-ghoul-btn" onclick="setRace('ghoul')">GHOUL</button>
                </div>
                <div class="race-indicator human" id="race-indicator">● HUMAN MODE</div>
            </div>
            <div class="points-remaining">
                残りポイント: <span class="count" id="points-left">56</span> / 56
            </div>
            <div id="special-stats"></div>

            <div class="equipped-summary" id="equipped-summary">
                <h3>> 装備コスト</h3>
                <div id="cost-summary"></div>
            </div>
        </aside>

        <!-- 右: Perk選択 -->
        <div class="perk-area">
            <div class="perk-tabs" id="perk-tabs"></div>
            <div class="perk-list-container">
                <div class="perk-list-header">
                    <h2 id="perk-list-title">Strength Perks</h2>
                    <input type="text" class="perk-search" id="perk-search" placeholder="Perkを検索..."
                        oninput="filterPerks()">
                </div>
                <div class="perk-grid" id="perk-grid"></div>
            </div>

            <!-- ビルドサマリー - ゲーム内レイアウト -->
            <div class="build-summary" id="build-summary">
                <div class="build-summary-header">
                    <h2>▲ MY PERKS ▲</h2>
                </div>
                <div id="build-list"></div>
            </div>
        </div>
    </div>

    <!-- 共有モーダル -->
    <div class="share-modal" id="share-modal" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="share-modal-content">
            <h3>> BUILD SHARE URL</h3>
            <div class="share-url-box" id="share-url"></div>
            <button class="header-btn" onclick="copyShareUrl()">📋 コピー</button>
            <button class="header-btn" onclick="document.getElementById('share-modal').classList.remove('active')"
                style="margin-left:8px;">✕ 閉じる</button>
        </div>
    </div>

    <!-- Perkデータ -->
    <script src="perk-data.js"></script>

    <script>
        /* ===== 状態管理 ===== */
        const SPECIAL_MAX = 15;
        const SPECIAL_MIN = 1;
        const TOTAL_POINTS = 56;
        const SPECIAL_ORDER = ['Strength', 'Perception', 'Endurance', 'Charisma', 'Intelligence', 'Agility', 'Luck'];
        const SPECIAL_LABELS = { Strength: 'S', Perception: 'P', Endurance: 'E', Charisma: 'C', Intelligence: 'I', Agility: 'A', Luck: 'L' };
        const SPECIAL_COLORS = {
            Strength: 'var(--str-color)', Perception: 'var(--per-color)', Endurance: 'var(--end-color)',
            Charisma: 'var(--chr-color)', Intelligence: 'var(--int-color)', Agility: 'var(--agi-color)', Luck: 'var(--lck-color)'
        };

        /* SPECIALポイント（各初期値1） */
        let specialPoints = {};
        SPECIAL_ORDER.forEach(s => specialPoints[s] = 1);

        /* 装備中のPerk: { "Strength": [{ perkIndex, rank }], ... } */
        let equippedPerks = {};
        SPECIAL_ORDER.forEach(s => equippedPerks[s] = []);

        /* レジェンダリーPerk装備（最大6枠） */
        let equippedLegendary = []; // [{ perkIndex, rank }]

        /* アクティブな変異 */
        let activeMutations = new Set();

        /* 現在表示しているタブ */
        let currentTab = 'Strength';

        /* 現在のキャラクタータイプ（human / ghoul） */
        let currentRace = 'human';

        /* ===== 初期化 ===== */
        function init() {
            // URL共有データの読み込み
            loadFromUrl();
            renderSpecialStats();
            renderTabs();
            renderPerkList();
            renderBuildSummary();
            updateCostSummary();
            updateRaceUI();
        }

        /* ===== 人間/グール切替 ===== */
        function setRace(race) {
            if (currentRace === race) return;
            currentRace = race;
            // モード切替時に装備中のPerkをリセット（race制限のため）
            SPECIAL_ORDER.forEach(s => equippedPerks[s] = []);
            equippedLegendary = [];
            updateRaceUI();
            renderPerkList();
            renderBuildSummary();
            updateCostSummary();
        }

        function updateRaceUI() {
            const humanBtn = document.getElementById('race-human-btn');
            const ghoulBtn = document.getElementById('race-ghoul-btn');
            const indicator = document.getElementById('race-indicator');

            humanBtn.classList.toggle('active', currentRace === 'human');
            ghoulBtn.classList.toggle('active', currentRace === 'ghoul');
            ghoulBtn.classList.toggle('ghoul-active', currentRace === 'ghoul');

            if (currentRace === 'ghoul') {
                indicator.className = 'race-indicator ghoul';
                indicator.innerHTML = '☢ GHOUL MODE';
            } else {
                indicator.className = 'race-indicator human';
                indicator.innerHTML = '● HUMAN MODE';
            }
        }

        /* ===== SPECIAL ===== */
        function getUsedPoints() {
            return Object.values(specialPoints).reduce((a, b) => a + b, 0);
        }

        function changeSpecial(stat, delta) {
            const newVal = specialPoints[stat] + delta;
            if (newVal < SPECIAL_MIN || newVal > SPECIAL_MAX) return;
            if (delta > 0 && getUsedPoints() >= TOTAL_POINTS) return;
            specialPoints[stat] = newVal;
            renderSpecialStats();
            updateCostSummary();
            if (currentTab === stat) renderPerkList();
            renderBuildSummary();
        }

        function renderSpecialStats() {
            const container = document.getElementById('special-stats');
            container.innerHTML = '';
            const remaining = TOTAL_POINTS - getUsedPoints();
            document.getElementById('points-left').textContent = remaining;
            document.getElementById('points-left').style.color = remaining === 0 ? '#ff6b6b' : 'var(--accent-color)';

            SPECIAL_ORDER.forEach(stat => {
                const val = specialPoints[stat];
                const pct = (val / SPECIAL_MAX) * 100;
                const isActive = currentTab === stat;

                const div = document.createElement('div');
                div.className = 'special-stat' + (isActive ? ' active' : '');
                div.onclick = () => { currentTab = stat; renderTabs(); renderPerkList(); renderSpecialStats(); };

                div.innerHTML = `
                    <span class="stat-letter" style="color:${SPECIAL_COLORS[stat]}">${SPECIAL_LABELS[stat]}</span>
                    <div class="stat-info">
                        <span class="stat-name">${stat}</span>
                        <div class="stat-bar"><div class="stat-bar-fill" style="width:${pct}%;background:${SPECIAL_COLORS[stat]}"></div></div>
                    </div>
                    <div class="stat-controls">
                        <button class="stat-btn" onclick="event.stopPropagation();changeSpecial('${stat}',-1)" ${val <= SPECIAL_MIN ? 'disabled' : ''}>-</button>
                        <span class="stat-value" style="color:${SPECIAL_COLORS[stat]}">${val}</span>
                        <button class="stat-btn" onclick="event.stopPropagation();changeSpecial('${stat}',1)" ${val >= SPECIAL_MAX || remaining <= 0 ? 'disabled' : ''}>+</button>
                    </div>`;
                container.appendChild(div);
            });
        }

        /* ===== タブ ===== */
        function renderTabs() {
            const container = document.getElementById('perk-tabs');
            container.innerHTML = '';
            [...SPECIAL_ORDER, 'Legendary', 'Mutations'].forEach(tab => {
                const btn = document.createElement('button');
                btn.className = 'perk-tab' + (currentTab === tab ? ' active' : '');
                btn.dataset.tab = tab;
                btn.textContent = tab;
                btn.onclick = () => { currentTab = tab; renderTabs(); renderPerkList(); };
                container.appendChild(btn);
            });
        }

        /* ===== Perkリスト描画 ===== */
        function renderPerkList() {
            const grid = document.getElementById('perk-grid');
            const title = document.getElementById('perk-list-title');
            grid.innerHTML = '';

            if (currentTab === 'Mutations') {
                title.textContent = 'Mutations (変異)';
                title.style.color = '#9b59b6';
                renderMutations(grid);
                return;
            }
            if (currentTab === 'Legendary') {
                title.textContent = 'Legendary Perks';
                title.style.color = 'var(--legendary-color)';
                renderLegendaryPerks(grid);
                return;
            }

            title.textContent = `${currentTab} Perks`;
            title.style.color = SPECIAL_COLORS[currentTab];

            // 人間/グールに応じてPerkリストを統合
            let perks = (PERK_DATA[currentTab] || []).filter(p => {
                if (!p.race) return true; // race未指定は共通
                return p.race === currentRace || p.race === 'both';
            });

            // グールモードの場合、グール専用データを追加
            if (currentRace === 'ghoul' && GHOUL_PERK_DATA[currentTab]) {
                perks = [...perks, ...GHOUL_PERK_DATA[currentTab]];
            }

            const search = document.getElementById('perk-search').value.toLowerCase();

            perks.forEach((perk, idx) => {
                if (search && !perk.name.toLowerCase().includes(search) && !perk.desc[0].toLowerCase().includes(search)) return;

                const equipped = equippedPerks[currentTab].find(e => e.perkIndex === idx);
                const currentRank = equipped ? equipped.rank : 0;

                const card = document.createElement('div');
                card.className = 'perk-card' + (currentRank > 0 ? ' equipped' : '');

                // 現在のランクの説明を表示（安全参照）
                const descIdx = currentRank > 0 ? currentRank - 1 : 0;
                const displayDesc = perk.desc[Math.min(descIdx, perk.desc.length - 1)] || '';
                const imgUrl = getPerkImageUrl(perk.name, 1);
                const costIdx = currentRank > 0 ? currentRank - 1 : 0;
                const displayCost = perk.cost[Math.min(costIdx, perk.cost.length - 1)] || perk.cost[0];

                card.innerHTML = `
                    <img class="perk-card-img" src="${imgUrl}" alt="${perk.name}" onerror="handlePerkImageError(this,'${perk.name.replace(/'/g, "\\\\'")}')" loading="lazy">
                    <div class="perk-card-body">
                        <div class="perk-card-header">
                            <span class="perk-card-name">${perk.name}</span>
                            <span class="perk-card-level">Lv.${perk.level} / Cost ${displayCost}</span>
                        </div>
                        <div class="perk-card-desc">${displayDesc}</div>
                        <div class="perk-card-ranks" data-special="${currentTab}" data-perk="${idx}">
                            ${Array.from({ length: perk.maxRank }, (_, r) =>
                    `<div class="rank-dot ${r < currentRank ? 'filled' : ''}" data-rank="${r + 1}" onclick="event.stopPropagation();togglePerkRank('${currentTab}',${idx},${r + 1})"></div>`
                ).join('')}
                        </div>
                    </div>`;

                card.onclick = () => togglePerk(currentTab, idx);
                grid.appendChild(card);
            });
        }

        function renderMutations(grid) {
            const search = document.getElementById('perk-search').value.toLowerCase();
            MUTATIONS.forEach((mut, idx) => {
                if (search && !mut.name.toLowerCase().includes(search)) return;
                const isActive = activeMutations.has(idx);
                const card = document.createElement('div');
                card.className = 'mutation-card' + (isActive ? ' active' : '');
                card.innerHTML = `
                    <div class="mutation-name">${mut.name}</div>
                    <div class="mutation-effect">
                        <span class="positive">＋ ${mut.positive}</span><br>
                        <span class="negative">− ${mut.negative}</span>
                    </div>`;
                card.onclick = () => {
                    if (isActive) activeMutations.delete(idx);
                    else activeMutations.add(idx);
                    renderPerkList();
                    renderBuildSummary();
                };
                grid.appendChild(card);
            });
        }

        function renderLegendaryPerks(grid) {
            const search = document.getElementById('perk-search').value.toLowerCase();
            // 人間/グールに応じてレジェンダリーPerkをフィルタリング
            let legendaryList = LEGENDARY_PERKS.filter(p => {
                if (!p.race) return true;
                return p.race === currentRace || p.race === 'both';
            });
            // グールモードの場合、グール専用レジェンダリーPerkを追加
            if (currentRace === 'ghoul') {
                legendaryList = [...legendaryList, ...GHOUL_LEGENDARY_PERKS];
            }
            legendaryList.forEach((perk, idx) => {
                if (search && !perk.name.toLowerCase().includes(search)) return;
                const equipped = equippedLegendary.find(e => e.perkIndex === idx);
                const currentRank = equipped ? equipped.rank : 0;
                const descIdx = currentRank > 0 ? currentRank - 1 : 0;
                const displayDesc = perk.desc[Math.min(descIdx, perk.desc.length - 1)] || '';

                const imgUrl = getPerkImageUrl(perk.name, 1);
                const card = document.createElement('div');
                card.className = 'legendary-card' + (currentRank > 0 ? ' equipped' : '');
                card.style.display = 'flex';
                card.style.gap = '12px';
                card.style.alignItems = 'flex-start';
                card.innerHTML = `
                    <img class="perk-card-img" src="${imgUrl}" alt="${perk.name}" onerror="handlePerkImageError(this,'${perk.name.replace(/'/g, "\\\\'")}')" loading="lazy">
                    <div class="perk-card-body">
                        <div class="perk-card-header">
                            <span class="perk-card-name">${perk.name}</span>
                        </div>
                        <div class="perk-card-desc">${displayDesc}</div>
                        <div class="perk-card-ranks">
                            ${Array.from({ length: perk.maxRank }, (_, r) =>
                    `<div class="rank-dot ${r < currentRank ? 'filled' : ''}" onclick="event.stopPropagation();toggleLegendaryRank(${idx},${r + 1})"></div>`
                ).join('')}
                        </div>
                    </div>`;
                card.onclick = () => toggleLegendary(idx);
                grid.appendChild(card);
            });
        }

        /* ===== Perk操作 ===== */
        function togglePerk(special, perkIdx) {
            const existing = equippedPerks[special].findIndex(e => e.perkIndex === perkIdx);
            if (existing >= 0) {
                equippedPerks[special].splice(existing, 1);
            } else {
                equippedPerks[special].push({ perkIndex: perkIdx, rank: 1 });
            }
            renderPerkList();
            updateCostSummary();
            renderBuildSummary();
        }

        function togglePerkRank(special, perkIdx, rank) {
            const existing = equippedPerks[special].find(e => e.perkIndex === perkIdx);
            if (existing) {
                if (existing.rank === rank) {
                    // 同じランクをクリック → ランクを下げる（1なら外す）
                    if (rank === 1) {
                        equippedPerks[special] = equippedPerks[special].filter(e => e.perkIndex !== perkIdx);
                    } else {
                        existing.rank = rank - 1;
                    }
                } else {
                    existing.rank = rank;
                }
            } else {
                equippedPerks[special].push({ perkIndex: perkIdx, rank: rank });
            }
            renderPerkList();
            updateCostSummary();
            renderBuildSummary();
        }

        function toggleLegendary(perkIdx) {
            const existing = equippedLegendary.findIndex(e => e.perkIndex === perkIdx);
            if (existing >= 0) {
                equippedLegendary.splice(existing, 1);
            } else {
                if (equippedLegendary.length >= 6) return; // 最大6枠
                equippedLegendary.push({ perkIndex: perkIdx, rank: 1 });
            }
            renderPerkList();
            renderBuildSummary();
        }

        function toggleLegendaryRank(perkIdx, rank) {
            const existing = equippedLegendary.find(e => e.perkIndex === perkIdx);
            if (existing) {
                if (existing.rank === rank) {
                    if (rank === 1) {
                        equippedLegendary = equippedLegendary.filter(e => e.perkIndex !== perkIdx);
                    } else {
                        existing.rank = rank - 1;
                    }
                } else {
                    existing.rank = rank;
                }
            } else {
                if (equippedLegendary.length >= 6) return;
                equippedLegendary.push({ perkIndex: perkIdx, rank: rank });
            }
            renderPerkList();
            renderBuildSummary();
        }

        /* ===== コスト計算 ===== */
        function getEquippedCost(special) {
            return equippedPerks[special].reduce((sum, e) => {
                const perk = PERK_DATA[special][e.perkIndex];
                return sum + (perk.cost[e.rank - 1] || 0);
            }, 0);
        }

        function updateCostSummary() {
            const container = document.getElementById('cost-summary');
            container.innerHTML = '';
            SPECIAL_ORDER.forEach(stat => {
                const cost = getEquippedCost(stat);
                const max = specialPoints[stat];
                const isOver = cost > max;
                const div = document.createElement('div');
                div.className = 'equipped-cost';
                div.innerHTML = `<span style="color:${SPECIAL_COLORS[stat]}">${SPECIAL_LABELS[stat]}</span>
                    <span class="${isOver ? 'over' : ''}">${cost} / ${max}${isOver ? ' ⚠' : ''}</span>`;
                container.appendChild(div);
            });
        }

        /* ===== ビルドサマリー（ゲーム内風） ===== */
        let selectedBuildPerk = null; // {type:'normal'|'legendary', special, perkIndex, rank}

        function renderBuildSummary() {
            const container = document.getElementById('build-list');
            const hasAny = SPECIAL_ORDER.some(s => equippedPerks[s].length > 0) || equippedLegendary.length > 0 || activeMutations.size > 0;

            if (!hasAny) {
                container.innerHTML = '<div class="build-empty">Perkを選択してビルドを作成してください</div>';
                return;
            }

            let html = '';

            // SPECIALヘッダー行
            html += '<div class="build-special-row">';
            SPECIAL_ORDER.forEach(stat => {
                const val = specialPoints[stat];
                const cost = getEquippedCost(stat);
                const isOver = cost > val;
                html += `<div class="build-special-col">
                    <span class="build-special-name" style="color:${SPECIAL_COLORS[stat]}">${stat.charAt(0)}${stat.slice(1).toLowerCase()}</span>
                    <span class="build-special-value" style="color:${isOver ? '#ff6b6b' : SPECIAL_COLORS[stat]}">${val}</span>
                </div>`;
            });
            html += '</div>';

            // 装備Perkグリッド
            html += '<div class="build-perks-grid">';
            SPECIAL_ORDER.forEach(stat => {
                html += '<div class="build-perk-column">';
                equippedPerks[stat].forEach(e => {
                    const perk = PERK_DATA[stat][e.perkIndex];
                    const cost = perk.cost[Math.min(e.rank - 1, perk.cost.length - 1)] || perk.cost[0];
                    const isSelected = selectedBuildPerk && selectedBuildPerk.type === 'normal' && selectedBuildPerk.special === stat && selectedBuildPerk.perkIndex === e.perkIndex;
                    const imgUrl = getPerkImageUrl(perk.name, e.rank);
                    html += `<div class="build-perk-item ${isSelected ? 'selected' : ''}" 
                        onclick="selectBuildPerk('normal','${stat}',${e.perkIndex},${e.rank})" 
                        title="${perk.name}">
                        <img class="build-perk-img" src="${imgUrl}" alt="${perk.name}" onerror="this.classList.add('error')">
                        <span class="build-perk-cost">${cost}</span>
                        <span class="build-perk-name">${perk.name}</span>
                    </div>`;
                });
                html += '</div>';
            });
            html += '</div>';

            // 選択Perk詳細
            if (selectedBuildPerk) {
                let detailHtml = '';
                if (selectedBuildPerk.type === 'normal') {
                    const perk = PERK_DATA[selectedBuildPerk.special][selectedBuildPerk.perkIndex];
                    const rank = equippedPerks[selectedBuildPerk.special].find(e => e.perkIndex === selectedBuildPerk.perkIndex);
                    if (rank) {
                        const r = rank.rank;
                        const imgUrl = getPerkImageUrl(perk.name, r);
                        const starsHtml = Array.from({ length: perk.maxRank }, (_, i) =>
                            `<span class="${i < r ? 'star-filled' : 'star-empty'}">${i < r ? '★' : '☆'}</span>`
                        ).join('');
                        detailHtml = `<div class="build-perk-detail">
                            <img class="build-detail-img" src="${imgUrl}" alt="${perk.name}" onerror="this.style.display='none'">
                            <div class="build-detail-info">
                                <div class="build-detail-name">${perk.name}</div>
                                <div class="build-detail-desc">${perk.desc[Math.min(r - 1, perk.desc.length - 1)] || ''}</div>
                                <div class="build-detail-stars">${starsHtml}</div>
                            </div>
                        </div>`;
                    }
                } else if (selectedBuildPerk.type === 'legendary') {
                    const perk = LEGENDARY_PERKS[selectedBuildPerk.perkIndex];
                    const eq = equippedLegendary.find(e => e.perkIndex === selectedBuildPerk.perkIndex);
                    if (eq) {
                        const r = eq.rank;
                        const imgUrl = getPerkImageUrl(perk.name, r);
                        const starsHtml = Array.from({ length: perk.maxRank }, (_, i) =>
                            `<span class="${i < r ? 'star-filled' : 'star-empty'}">${i < r ? '★' : '☆'}</span>`
                        ).join('');
                        detailHtml = `<div class="build-perk-detail">
                            <img class="build-detail-img" src="${imgUrl}" alt="${perk.name}" onerror="this.style.display='none'" style="border-color:var(--legendary-color)">
                            <div class="build-detail-info">
                                <div class="build-detail-name" style="color:var(--legendary-color)">${perk.name}</div>
                                <div class="build-detail-desc">${perk.desc[Math.min(r - 1, perk.desc.length - 1)] || ''}</div>
                                <div class="build-detail-stars">${starsHtml}</div>
                            </div>
                        </div>`;
                    }
                }
                html += detailHtml;
            }

            // レジェンダリーPerk
            if (equippedLegendary.length > 0) {
                html += '<div class="build-legendary-section">';
                html += `<div class="build-legendary-title">レジェンダリーPerk (${equippedLegendary.length}/6)</div>`;
                html += '<div class="build-legendary-list">';
                equippedLegendary.forEach(e => {
                    const perk = LEGENDARY_PERKS[e.perkIndex];
                    const imgUrl = getPerkImageUrl(perk.name, e.rank);
                    const isSelected = selectedBuildPerk && selectedBuildPerk.type === 'legendary' && selectedBuildPerk.perkIndex === e.perkIndex;
                    html += `<div class="build-legendary-item ${isSelected ? 'selected' : ''}" 
                        onclick="selectBuildPerk('legendary','',${e.perkIndex},${e.rank})" style="cursor:pointer;${isSelected ? 'border-color:var(--legendary-color);' : ''}">
                        <img src="${imgUrl}" alt="${perk.name}" onerror="this.style.display='none'">
                        <span class="l-name">${perk.name}</span>
                        <span class="l-rank">★${e.rank}</span>
                    </div>`;
                });
                html += '</div></div>';
            }

            // ミューテーション
            if (activeMutations.size > 0) {
                html += '<div class="build-mutation-section">';
                html += `<div class="build-mutation-title">Mutations (${activeMutations.size})</div>`;
                html += '<div class="build-mutation-list">';
                activeMutations.forEach(idx => {
                    html += `<span class="build-mutation-tag">${MUTATIONS[idx].name}</span>`;
                });
                html += '</div></div>';
            }

            container.innerHTML = html;
        }

        function selectBuildPerk(type, special, perkIndex, rank) {
            if (selectedBuildPerk && selectedBuildPerk.type === type && selectedBuildPerk.perkIndex === perkIndex && selectedBuildPerk.special === special) {
                selectedBuildPerk = null; // 同じものをクリックで選択解除
            } else {
                selectedBuildPerk = { type, special, perkIndex, rank };
            }
            renderBuildSummary();
        }

        /* ===== フィルタ ===== */
        function filterPerks() {
            renderPerkList();
        }

        /* ===== リセット ===== */
        function resetBuild() {
            if (!confirm('ビルドをリセットしますか？')) return;
            SPECIAL_ORDER.forEach(s => { specialPoints[s] = 1; equippedPerks[s] = []; });
            equippedLegendary = [];
            activeMutations.clear();
            renderSpecialStats();
            renderPerkList();
            renderBuildSummary();
            updateCostSummary();
        }

        /* ===== 共有 ===== */
        function shareBuild() {
            const data = {
                s: SPECIAL_ORDER.map(s => specialPoints[s]),
                p: {},
                l: equippedLegendary.map(e => [e.perkIndex, e.rank]),
                m: Array.from(activeMutations)
            };
            SPECIAL_ORDER.forEach((stat, i) => {
                if (equippedPerks[stat].length > 0) {
                    data.p[i] = equippedPerks[stat].map(e => [e.perkIndex, e.rank]);
                }
            });
            const encoded = btoa(JSON.stringify(data));
            const url = window.location.origin + window.location.pathname + '?b=' + encoded;
            document.getElementById('share-url').textContent = url;
            document.getElementById('share-modal').classList.add('active');
        }

        function copyShareUrl() {
            const url = document.getElementById('share-url').textContent;
            navigator.clipboard.writeText(url).then(() => {
                const btn = event.target;
                btn.textContent = '✓ コピーしました';
                setTimeout(() => btn.textContent = '📋 コピー', 2000);
            });
        }

        function loadFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const b = params.get('b');
            if (!b) return;
            try {
                const data = JSON.parse(atob(b));
                if (data.s) SPECIAL_ORDER.forEach((s, i) => specialPoints[s] = data.s[i] || 1);
                if (data.p) {
                    Object.entries(data.p).forEach(([i, perks]) => {
                        const stat = SPECIAL_ORDER[parseInt(i)];
                        equippedPerks[stat] = perks.map(([perkIndex, rank]) => ({ perkIndex, rank }));
                    });
                }
                if (data.l) equippedLegendary = data.l.map(([perkIndex, rank]) => ({ perkIndex, rank }));
                if (data.m) data.m.forEach(idx => activeMutations.add(idx));
            } catch (e) { console.error('ビルドデータの読み込みに失敗:', e); }
        }

        /* ===== 起動 ===== */
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
